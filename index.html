<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alerte Buts - CH vs Hurricanes</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #111;
            color: #fff;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: 10px auto;
            background: #191919;
            padding: 20px;
            border-radius: 15px;
            border-top: 5px solid #A6192E;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        h1 { margin-bottom: 20px; font-size: 1.5rem; }
        
        .scoreboard {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 30px 0;
            gap: 15px;
        }
        
        .team-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 35%;
        }

        .team-name {
            font-size: 1.2rem;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .team-logo {
            width: 100%;
            max-width: 100px;
            height: auto;
            margin-bottom: 10px;
        }

        .score {
            font-size: 3rem;
            color: #A6192E;
            font-weight: bold;
        }

        .vs-divider {
            font-size: 1.2rem;
            font-weight: bold;
            color: #888;
        }

        .btn-audio {
            background-color: #A6192E;
            color: white;
            border: none;
            padding: 15px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            width: 100%;
            max-width: 350px;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 5px 15px rgba(166, 25, 46, 0.4);
        }
        .btn-audio:hover { background-color: #c12439; }
        .btn-audio:active { transform: scale(0.98); }
        .btn-audio.active {
            background-color: #248a3d;
            box-shadow: 0 5px 15px rgba(36, 138, 61, 0.4);
            cursor: default;
        }
        .status {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #888;
            padding: 0 10px;
            word-break: break-word;
        }

        .test-zone {
            margin-top: 30px; 
            border-top: 1px dashed #444; 
            padding-top: 20px;
        }
        .btn-test {
            color: white; 
            border: none; 
            padding: 10px 15px; 
            margin: 5px; 
            border-radius: 5px; 
            cursor: pointer;
            font-weight: bold;
        }

        @media (max-width: 400px) {
            .score { font-size: 2.5rem; }
            .team-name { font-size: 1rem; }
            h1 { font-size: 1.3rem; }
        }
    </style>
